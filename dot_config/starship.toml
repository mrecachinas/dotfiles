# Starship prompt configuration
# Docs: https://starship.rs/config/

# Prompt format (two-line)
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$ruby\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Timeout for commands (ms)
command_timeout = 1000

# ===== Character (prompt symbol) =====
[character]
success_symbol = "[⚡](bold green)"
error_symbol = "[⚡](bold red)"
vimcmd_symbol = "[⚡](bold yellow)"

# ===== Directory =====
[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 🔒"

# ===== Git =====
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ===== Languages (only show in relevant projects) =====
[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version)]($style) "
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", ".python-version"]

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version)]($style) "
detect_files = ["go.mod", "go.sum"]

[rust]
symbol = "🦀 "
style = "bold red"
format = "[$symbol($version)]($style) "
detect_files = ["Cargo.toml"]

[ruby]
symbol = " "
style = "bold red"
format = "[$symbol($version)]($style) "
detect_files = ["Gemfile", ".ruby-version"]

# ===== Docker (only when context is not default) =====
[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = false
detect_files = ["docker-compose.yml", "Dockerfile"]
disabled = false

# ===== Command Duration =====
[cmd_duration]
min_time = 2_000  # Show if command took > 2s
style = "bold yellow"
format = "[took $duration]($style) "
show_milliseconds = false

# ===== Disabled modules (declutter) =====
[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true

[azure]
disabled = true

[package]
disabled = true

[time]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true
